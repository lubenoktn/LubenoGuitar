<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>LubenoGuitar – manuál</title>
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:4.5rem}
body{margin:0;background:#090d16;color:#e2e8f0;font:16px/1.65 ui-sans-serif,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:#34d399}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1rem;background:#111827f2;border-bottom:1px solid #1f293d}
header a{font-weight:700;text-decoration:none}
button{font:inherit;font-size:.8rem;font-weight:700;color:#f1f5f9;background:#1f293d;border:1px solid #2d3b55;border-radius:.4rem;padding:.35rem .7rem;cursor:pointer;min-height:36px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #34d399;outline-offset:2px}
.wrap{max-width:72rem;margin:0 auto;padding:1rem;display:grid;gap:1.5rem}
nav{background:#111827;border:1px solid #1f293d;border-radius:.8rem;padding:.8rem 1rem;font-size:.9rem}
nav summary{font-weight:700;cursor:pointer}
nav ul{list-style:none;margin:.5rem 0 0;padding:0}
nav ul ul{margin:0 0 .3rem;padding-left:.9rem;font-size:.85rem}
nav li{margin:.2rem 0}
nav a{color:#cbd5e1;text-decoration:none}
nav a:hover{color:#fff;text-decoration:underline}
main{min-width:0;max-width:48rem}
h1{font-size:1.7rem;line-height:1.25;color:#fbbf24;margin:.2rem 0 1rem}
h2{font-size:1.3rem;line-height:1.3;color:#fbbf24;margin:2.4rem 0 .6rem;padding-top:.6rem;border-top:1px solid #1f293d}
h3{font-size:1.05rem;color:#f1f5f9;margin:1.6rem 0 .4rem}
p,ul,ol{margin:.6rem 0}
li{margin:.25rem 0}
code{font:.9em ui-monospace,SFMono-Regular,Menlo,monospace;background:#111827;border:1px solid #1f293d;border-radius:.3rem;padding:.05rem .3rem;color:#67e8f9}
.tw{overflow-x:auto;margin:.8rem 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:.45rem .6rem;border:1px solid #1f293d}
th{background:#111827;color:#f1f5f9}
tr:nth-child(even) td{background:#0d1320}
[hidden]{display:none!important}
@media (min-width:60rem){.wrap{grid-template-columns:17rem minmax(0,1fr);align-items:start}nav{position:sticky;top:4.2rem;max-height:calc(100vh - 5.2rem);overflow:auto}}
</style>
</head>
<body>
<header>
 <a href="LubenoGuitar.html">← <span data-t="back"></span></a>
 <button id="lang" aria-label="Jazyk / Language">EN</button>
</header>
<div class="wrap">
 <nav aria-label="Obsah / Contents"><details id="tocbox"><summary data-t="toc"></summary><!--TOC--></details></nav>
 <main><!--BODY--></main>
</div>
<script>
// both languages are in the page; ?lang= (or the app's saved language) picks one, #chapter scrolls to it
(function(){
 var T={sk:{back:'Späť do aplikácie',toc:'Obsah',title:'LubenoGuitar – manuál'},en:{back:'Back to the app',toc:'Contents',title:'LubenoGuitar – Manual'}};
 var lang=new URLSearchParams(location.search).get('lang');
 if(lang!=='sk'&&lang!=='en'){lang='sk';try{var s=JSON.parse(localStorage.getItem('lg_auto'));if(s&&s.o&&s.o.lang==='en')lang='en'}catch(e){}}
 function go(){var id=location.hash.replace(/^#(sk-|en-)?/,'');var el=id&&document.getElementById(lang+'-'+id);if(el)el.scrollIntoView()}
 function show(l){lang=l;document.documentElement.lang=l;document.title=T[l].title;
  document.querySelectorAll('[data-lang]').forEach(function(e){e.hidden=e.dataset.lang!==l});
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T[l][e.dataset.t]});
  document.getElementById('lang').textContent=l==='en'?'SK':'EN'}
 document.getElementById('tocbox').open=innerWidth>=960;
 document.getElementById('lang').onclick=function(){var id=location.hash.replace(/^#(sk-|en-)?/,'');show(lang==='en'?'sk':'en');try{history.replaceState(null,'','?lang='+lang+(id?'#'+id:''))}catch(e){}go()};
 addEventListener('hashchange',go);
 show(lang);go();
})();
</script>
</body>
</html>
